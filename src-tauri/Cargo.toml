[package]
name = "drafiqo"
version = "0.1.0"
description = "Drafiqo — a local-first desktop design editor"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "drafiqo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The binary name is what the macOS Dock and the process list show in dev.
[[bin]]
name = "Drafiqo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
